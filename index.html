<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121821" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="발음 체크">
<title>발음 체크</title>
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#1B2A41; --muted:#5E6B7D; --line:#D5DCE4;
  --accent:#2B4C7E; --accent-ink:#FFFFFF; --mark:#F7DC5A; --pen:#C8423B; --ok:#2F7D5B; --field:#F7F9FB;
  --en:"Iowan Old Style","Charter","Georgia","Times New Roman",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#121821; --surface:#1B2330; --ink:#E6EBF2; --muted:#94A1B3; --line:#2C3746;
    --accent:#8FB0E0; --accent-ink:#0F1722; --mark:rgba(247,220,90,.38); --pen:#F08A80; --ok:#7CC7A0; --field:#151C27; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--ui);min-height:100vh}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.head-in{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.brand b{font-size:1.15rem}
.brand span{font-family:var(--en);font-style:italic;color:var(--muted);font-size:.95rem}
nav{display:flex;gap:4px}
nav button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:.95rem;
  padding:10px 12px;min-height:44px;cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

main{max-width:760px;margin:0 auto;padding:24px 16px calc(env(safe-area-inset-bottom) + 64px)}
h1{font-size:1.5rem;line-height:1.3;margin:0 0 8px}
h2{font-size:1rem;margin:32px 0 10px;color:var(--muted);font-weight:600}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.875rem}

.btn{appearance:none;font:inherit;font-size:.95rem;min-height:44px;padding:8px 16px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--pen)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

label.f{display:block;font-size:.875rem;color:var(--muted);margin:16px 0 6px}
textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:14em;resize:vertical;font-family:var(--en);font-size:1.05rem;line-height:1.55}
select{width:auto;min-height:44px}
textarea:focus,select:focus{outline:none;border-color:var(--accent)}

.notice{background:var(--surface);border:1px dashed var(--pen);border-radius:8px;padding:10px 12px;font-size:.92rem;margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 16px;margin-top:8px}
.setting{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0}

/* Practice: the read-aloud sheet */
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:.875rem;margin-bottom:10px;font-variant-numeric:tabular-nums}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 20px 18px}
.target{font-family:var(--en);font-size:clamp(1.4rem,4.5vw,2rem);line-height:1.55;margin:0;word-break:break-word}
.target .w{padding:0 .02em}
.target .miss{text-decoration:underline wavy var(--pen);text-decoration-thickness:2px;text-underline-offset:6px;text-decoration-skip-ink:none}
.target .amb{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 92%,transparent 92%)}
.heard{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line);min-height:2.4em}
.heard .lbl{font-size:.8rem;color:var(--muted);display:block;margin-bottom:2px}
.heard .txt{font-family:var(--en);font-size:1.1rem}
.heard .txt.live{color:var(--muted);font-style:italic}
.heard .extra{text-decoration:underline wavy var(--pen);text-underline-offset:4px;text-decoration-skip-ink:none}
.verdict{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.9rem;color:var(--muted)}
.verdict b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;color:var(--muted);margin:10px 0 0}
.legend .miss{text-decoration:underline wavy var(--pen);text-underline-offset:4px}
.legend .amb{background:linear-gradient(transparent 40%,var(--mark) 40%)}
.target .frame{color:var(--muted);font-style:italic}
.frame-hint{font-size:.84rem;color:var(--muted);margin:8px 0 0}

.mic{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;margin:16px 0 10px;
  font:inherit;font-size:1.1rem;font-weight:600;border-radius:12px;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink)}
.mic.on{background:var(--pen);color:#fff}
.mic .dot{width:12px;height:12px;border-radius:50%;background:currentColor;opacity:.9}
@media (prefers-reduced-motion:no-preference){ .mic.on .dot{animation:beat 1s ease-in-out infinite} }
@keyframes beat{50%{transform:scale(.55);opacity:.5}}
.nav3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.items{margin-top:28px;border-top:1px solid var(--line)}
.it{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:12px 4px;font:inherit;color:var(--ink);cursor:pointer}
.it .n{color:var(--muted);font-size:.8rem;min-width:24px;font-variant-numeric:tabular-nums}
.it .t{flex:1;font-family:var(--en);font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .s{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.it .s.good{color:var(--ok)} .it .s.bad{color:var(--pen)}
.it[aria-current="true"]{background:var(--surface)}

/* More accessible word drill, reading history, and touch-friendly layouts */
.word-button{border:0;background:none;font:inherit;font-family:inherit;color:inherit;cursor:pointer;border-radius:3px;padding:0 .02em}
.word-button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.summary-strip{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--muted);margin:0 0 9px}
.summary-strip b{color:var(--ink)}
.progress-track{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.progress-track i{display:block;height:100%;background:var(--ok)}
.focus-panel,.history{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.focus-panel p{margin:8px 0}
.history-entries{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.history-pill{background:var(--field);border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-variant-numeric:tabular-nums}
@media(max-width:540px){main{padding:14px 12px 70px}.sheet{padding:18px 14px}.target{font-size:clamp(1.35rem,6vw,1.85rem)}.mic{min-height:60px;position:sticky;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:5;box-shadow:0 4px 15px rgba(0,0,0,.14)}.nav3{gap:6px}.nav3 .btn{padding:10px 4px}.weak{grid-template-columns:minmax(72px,auto) 1fr auto;gap:6px}.it{gap:7px}.it .t{min-width:0}}

/* Weak words */
.weak{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:6px 14px;align-items:center;
  padding:12px 0;border-top:1px solid var(--line)}
.weak:first-child{border-top:0}
.weak .word{font-family:var(--en);font-size:1.15rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.weak .cnt{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:.92rem;z-index:60;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="brand"><b>발음 체크</b><span>say it, see what it heard</span></div>
    <nav aria-label="메뉴">
      <button data-act="go" data-to="script">스크립트</button>
      <button data-act="go" data-to="practice">연습</button>
      <button data-act="go" data-to="weak">약한 단어</button>
    </nav>
  </div>
</header>
<main id="main"></main>

<script>
/* ---------- Storage adapter (Claude app storage, then localStorage, then memory) ---------- */
const KEY = 'pron-check-v1';
const Store = (() => {
  let mode = 'memory', mem = null, busy = false, pending = null;
  function detect() {
    if (window.storage && typeof window.storage.get === 'function') { mode = 'claude'; return; }
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); mode = 'local'; } catch (e) { mode = 'memory'; }
  }
  async function load() {
    detect();
    try {
      if (mode === 'claude') { try { const r = await window.storage.get(KEY, false); return r ? JSON.parse(r.value) : null; } catch (e) { return null; } }
      if (mode === 'local') { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }
    } catch (e) { console.error(e); }
    return mem ? JSON.parse(mem) : null;
  }
  async function writeOnce(s) {
    if (mode === 'claude') { const r = await window.storage.set(KEY, s, false); if (!r) throw new Error('empty response'); }
    else if (mode === 'local') localStorage.setItem(KEY, s);
  }
  async function save(d) {
    pending = JSON.stringify(d);
    if (busy) return;
    busy = true;
    while (pending !== null) {
      const s = pending; pending = null; mem = s;
      if (mode === 'memory') continue;
      let ok = false;
      for (const w of [0, 800, 2500]) {
        if (w) await new Promise(r => setTimeout(r, w));
        try { await writeOnce(s); ok = true; break; } catch (e) { console.warn('save retry', e && e.message); }
      }
      if (!ok) toast('기록을 저장하지 못했어요. 이 화면에서는 계속 쓸 수 있어요.');
    }
    busy = false;
  }
  return { load, save, get mode() { return mode; } };
})();

/* ---------- State ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const DEFAULT_SETTINGS = { lang: 'en-US', ttsRate: 0.9, ttsProvider: 'browser', googleVoice: 'female', recordSelf: 'on', frame: 'on' };
let data = { script: '', items: [], pos: 0, results: {}, history: {}, stats: {}, settings: { ...DEFAULT_SETTINGS } };
let view = 'script';
let rec = null, listening = false, liveText = '', lastError = '';
let saveTimer = null;
let focusWord = null, focusResult = null; // temporary word-only drill
let googleTtsKey = ''; // 메모리에서만 사용, 영구 저장하지 않음
let ttsAudio = null, ttsUrl = null, ttsRequest = null, ttsSeq = 0;
let mediaStream = null, mediaRec = null, recChunks = [], myAudioUrl = null, myAudioFor = '', mineAudio = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(() => Store.save(data), 600); }
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

const SAMPLE = `right
light
think
sink
very
berry
sheep
ship
The rabbit ran across the road before the light turned red.
I think the three of them will arrive on Thursday.
She sells fresh vegetables at the village market every Friday.
Could you leave the file on the left side of the desk?`;

/* ---------- Text handling ---------- */
const ABBR = new Set(['mr','mrs','ms','dr','prof','sr','jr','st','vs','etc','e.g','i.e','u.s','u.k','a.m','p.m','no','inc','ltd','co']);
function splitItems(text) {
  const out = [];
  for (const line of text.replace(/\r/g, '').split(/\n+/)) {
    const t = line.replace(/\s+/g, ' ').trim(); if (!t) continue;
    let start = 0, m; const re = /[.!?…]+["'”’)\]]*(?=\s|$)/g;
    while ((m = re.exec(t))) {
      const end = m.index + m[0].length, rest = t.slice(end).trimStart();
      if (rest && !/^["'“‘(\[]?[A-Z0-9]/.test(rest)) continue;
      if (m[0][0] === '.') {
        const w = ((t.slice(start, m.index).match(/([A-Za-z.]+)$/) || [''])[0]).replace(/^\.+/, '').toLowerCase();
        if (ABBR.has(w) || /^[a-z]$/.test(w)) continue;
      }
      const s = t.slice(start, end).trim(); if (s) out.push(s); start = end;
    }
    const tail = t.slice(start).trim(); if (tail) out.push(tail);
  }
  return out;
}
// Tokens keep hyphenated parts separate so "well-known" matches "well known".
function tokens(s) { return String(s || '').match(/[^\s\-–—]+[\-–—]?/g) || []; }
const NUM = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const ALIAS = { mr: 'mister', mrs: 'missus', dr: 'doctor', ok: 'okay' };
// 발음이 같은 단어는 같은 단어로 취급 (각 묶음의 첫 단어가 대표). 최소대립쌍(right/light 등)은 넣지 말 것.
const HOMOPHONES = [
  ['right','write','rite','wright'], ['two','to','too'], ['four','for','fore'], ['one','won'], ['eight','ate'],
  ['there','their',"they're"], ['know','no'], ['knew','new'], ['hear','here'], ['see','sea'], ['buy','by','bye'],
  ['meet','meat'], ['week','weak'], ['peace','piece'], ['whole','hole'], ['weather','whether'], ['son','sun'],
  ['flower','flour'], ['mail','male'], ['sale','sail'], ['tail','tale'], ['road','rode','rowed'], ['blue','blew'],
  ['where','wear'], ['which','witch'], ['berry','bury'], ['light','lite'], ['night','knight'], ['hour','our'],
  ['wait','weight'], ['made','maid'], ['pair','pear','pare'], ['plain','plane'], ['break','brake'],
  ['its',"it's"], ['your',"you're"]
];
const HOMO = {};
HOMOPHONES.forEach(g => g.forEach(w => { HOMO[w] = g[0]; }));
function norm(w) {
  let x = w.replace(/[’‘]/g, "'").toLowerCase().replace(/[^\p{L}\p{N}']/gu, '').replace(/^'+|'+$/g, '');
  if (/^\d+$/.test(x) && +x <= 20) x = NUM[+x];
  x = ALIAS[x] || x;
  return HOMO[x] || x;
}
// Minimum edit-distance alignment: identifies exact matches, substitutions, omissions, and insertions.
function alignWords(A, B) {
  const n = A.length, m = B.length;
  const dp = Array.from({length:n+1}, () => Array(m+1).fill(0));
  for (let i=0;i<=n;i++) dp[i][0]=i;
  for (let j=0;j<=m;j++) dp[0][j]=j;
  for (let i=1;i<=n;i++) for (let j=1;j<=m;j++) {
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(A[i-1]===B[j-1]?0:1));
  }
  const marks=Array(n).fill('miss'), heardMarks=Array(m).fill('extra'), replacements=Array(n).fill('');
  let i=n,j=m;
  while(i>0 || j>0) {
    if(i>0 && j>0 && A[i-1]===B[j-1] && dp[i][j]===dp[i-1][j-1]) {
      marks[--i]='ok'; heardMarks[--j]='ok';
    } else if(i>0 && j>0 && dp[i][j]===dp[i-1][j-1]+1) {
      marks[--i]='replace'; replacements[i]=B[j-1]; heardMarks[--j]='replace';
    } else if(i>0 && dp[i][j]===dp[i-1][j]+1) {
      marks[--i]='miss';
    } else { heardMarks[--j]='extra'; }
  }
  return {marks, heardMarks, replacements};
}
function trackWords(T, marks) {
  T.forEach((w,k) => {
    const key=norm(w); if(!key)return;
    const stat=data.stats[key]||(data.stats[key]={word:w.replace(/[^\p{L}\p{N}'’\-]/gu,'').replace(/-$/,''),tries:0,miss:0});
    stat.tries++;
    if(marks[k]==='amb')stat.miss+=0.5;
    else if(marks[k]!=='ok')stat.miss++;
  });
}
function scoreReading(target, alts) {
  const T=tokens(target), TN=T.map(norm), best=alts[0]||'';
  const primary=alignWords(TN,tokens(best).map(norm));
  const others=alts.slice(1).map(a=>alignWords(TN,tokens(a).map(norm)).marks);
  const marks=primary.marks.map((m,k)=>m!=='ok'&&others.some(a=>a[k]==='ok')?'amb':m);
  const real=TN.filter(Boolean).length, ok=marks.filter(m=>m==='ok').length, amb=marks.filter(m=>m==='amb').length;
  // Extra recognized words reduce the score instead of being silently ignored.
  const extras=primary.heardMarks.filter(m=>m==='extra').length;
  const score=(real+extras)?Math.round(ok/(real+extras)*100):0;
  return {heard:best,heardMarks:primary.heardMarks,marks,replacements:primary.replacements,
    score,ok,amb,real, extras,
    omitted:marks.filter(m=>m==='miss').length, substituted:marks.filter(m=>m==='replace').length};
}
const FRAME = ['Say', 'again'];
function useFrame(t) { return data.settings.frame === 'on' && tokens(t).length === 1; }
function spokenText(t) { return useFrame(t) ? `${FRAME[0]} ${t} ${FRAME[1]}.` : t; }
// 단어 항목은 "Say ___ again"으로 읽게 하고, 가운데 단어만 채점
function scoreItem(text, alts) {
  if (!useFrame(text)) return scoreReading(text, alts);
  const r = scoreReading(`${FRAME[0]} ${text} ${FRAME[1]}`, alts), m = r.marks[1];
  return { ...r, marks: [m], replacements: [r.replacements[1]], score: m === 'ok' ? 100 : 0,
    ok: +(m === 'ok'), amb: +(m === 'amb'), real: 1, extras: 0,
    omitted: +(m === 'miss'), substituted: +(m === 'replace'), framed: true };
}
function evaluate(i, alts) {
  const r = scoreItem(data.items[i], alts);
  trackWords(tokens(data.items[i]), r.marks);
  const history = data.history || (data.history = {});
  (history[i] || (history[i] = [])).push({ score: r.score, ok: r.ok, real: r.real, at: Date.now() });
  data.results[i] = r;
  scheduleSave();
}
function evaluateFocus(word, alts) {
  focusResult = scoreItem(word, alts);
  trackWords(tokens(word), focusResult.marks);
  scheduleSave();
}

/* ---------- Speech recognition ---------- */
function micBlocker() {
  if (!SR) return '이 브라우저는 음성인식을 지원하지 않아요. 아이패드나 아이폰은 사파리, PC는 크롬이나 엣지에서 열어 주세요.';
  if (!window.isSecureContext) return '음성인식은 https 주소에서만 돼요. GitHub Pages 주소로 열거나, PC에서는 http://localhost로 열어 주세요.';
  return '';
}
const ERR = {
  'not-allowed': '마이크 권한이 막혀 있어요. 주소창의 사이트 설정에서 마이크를 허용해 주세요. Claude 앱 미리보기에서는 마이크를 쓸 수 없을 수 있어요.',
  'service-not-allowed': '음성인식을 쓸 수 없어요. 아이패드라면 설정 > 일반 > 키보드에서 받아쓰기를 켠 뒤 다시 시도해 주세요.',
  'no-speech': '소리가 들리지 않았어요. 마이크 버튼을 누르고 바로 읽어 주세요.',
  'audio-capture': '마이크를 찾지 못했어요. 다른 앱이 마이크를 쓰고 있는지 확인해 주세요.',
  'network': '음성인식 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.',
  'language-not-supported': '선택한 영어 종류를 이 기기에서 인식할 수 없어요. 연습 화면 아래에서 다른 영어를 골라 주세요.'
};

/* ---------- 내 목소리 녹음 ---------- */
function startRecording() {
  if (data.settings.recordSelf !== 'on' || !navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    if (!listening) { stream.getTracks().forEach(t => t.stop()); return; }
    mediaStream = stream; recChunks = [];
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    mediaRec.start();
  }).catch(() => { mediaStream = null; mediaRec = null; });
}
function stopRecording(tag) {
  return new Promise(resolve => {
    const mr = mediaRec, stream = mediaStream; mediaRec = null; mediaStream = null;
    const done = () => { if (stream) stream.getTracks().forEach(t => t.stop()); resolve(); };
    if (!mr || mr.state === 'inactive') { done(); return; }
    mr.onstop = () => {
      if (recChunks.length) {
        if (myAudioUrl) URL.revokeObjectURL(myAudioUrl);
        myAudioUrl = URL.createObjectURL(new Blob(recChunks, { type: mr.mimeType || 'audio/mp4' }));
        myAudioFor = tag;
      }
      done();
    };
    try { mr.stop(); } catch (e) { done(); }
  });
}
function clearMine() {
  if (mineAudio) { mineAudio.pause(); mineAudio = null; }
  if (myAudioUrl) URL.revokeObjectURL(myAudioUrl);
  myAudioUrl = null; myAudioFor = '';
}
function playMine() {
  if (!myAudioUrl) return;
  stopTts();
  mineAudio = new Audio(myAudioUrl);
  mineAudio.play().catch(() => toast('녹음을 재생하지 못했어요.'));
}

function startListening() {
  const block = micBlocker(); if (block) { toast(block); return; }
  stopTts();
  const i = data.pos, activeWord = focusWord, tag = activeWord ? `w:${activeWord}` : `s:${i}`;
  rec = new SR();
  rec.lang = data.settings.lang; rec.interimResults = true; rec.maxAlternatives = 3; rec.continuous = false;
  let finals = null; liveText = ''; lastError = '';
  rec.onresult = e => {
    const res = Array.from(e.results);
    liveText = res.map(r => r[0].transcript).join(' ').trim();
    if (res.length && res.every(r => r.isFinal)) {
      const maxAlt = Math.max(...res.map(r => r.length));
      finals = [];
      for (let k = 0; k < maxAlt; k++) finals.push(res.map(r => (r[k] || r[0]).transcript).join(' ').trim());
    }
    const el = $('#live'); if (el) { el.textContent = liveText || '듣는 중…'; }
  };
  rec.onerror = e => { lastError = ERR[e.error] || (e.error === 'aborted' ? '' : `음성인식 오류: ${e.error}`); };
  rec.onend = () => {
    listening = false; rec = null;
    if (!finals && liveText) finals = [liveText];
    if (finals && finals[0]) {
      const candidates = [...new Set(finals.filter(Boolean))];
      if (activeWord) evaluateFocus(activeWord, candidates); else evaluate(i, candidates);
    }
    else if (lastError) toast(lastError);
    else toast('인식된 말이 없어요. 다시 한 번 읽어 주세요.');
    if (view === 'practice') render();
    stopRecording(tag).then(() => { if (view === 'practice' && !listening) render(); });
  };
  try { rec.start(); listening = true; startRecording(); render(); }
  catch (e) { listening = false; stopRecording(tag); toast('음성인식을 시작하지 못했어요. 잠시 후 다시 눌러 주세요.'); }
}
function stopListening() { if (rec) rec.stop(); }

/* ---------- Text to speech: Google Cloud or native browser ---------- */
function stopTts() {
  ++ttsSeq;
  if (ttsRequest) { ttsRequest.abort(); ttsRequest = null; }
  if (ttsAudio) { ttsAudio.pause(); ttsAudio.removeAttribute('src'); ttsAudio.load(); ttsAudio = null; }
  if (ttsUrl) { URL.revokeObjectURL(ttsUrl); ttsUrl = null; }
  if (mineAudio) { mineAudio.pause(); mineAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function browserSpeak(text) {
  if (!('speechSynthesis' in window)) { toast('이 브라우저는 원문 읽어 주기를 지원하지 않아요.'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = data.settings.lang; u.rate = data.settings.ttsRate;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_', '-') === data.settings.lang);
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function googleVoiceName() {
  const lang = data.settings.lang;
  const voices = {
    'en-US': ['en-US-Neural2-F','en-US-Neural2-D'],
    'en-GB': ['en-GB-Neural2-A','en-GB-Neural2-B'],
    'en-AU': ['en-AU-Neural2-A','en-AU-Neural2-B'],
    'en-CA': ['en-CA-Standard-A','en-CA-Standard-B']
  };
  const options = voices[lang] || voices['en-US'];
  return options[data.settings.googleVoice === 'male' ? 1 : 0];
}
async function speak(text) {
  stopTts();
  if (data.settings.ttsProvider !== 'google') { browserSpeak(text); return; }
  if (!googleTtsKey.trim()) { toast('Google Cloud API 키를 입력해 주세요.'); return; }
  const seq = ttsSeq;
  const controller = new AbortController(); ttsRequest = controller;
  toast('Google 음성을 불러오는 중…');
  try {
    const resp = await fetch('https://texttospeech.googleapis.com/v1/text:synthesize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': googleTtsKey.trim() },
      body: JSON.stringify({
        input: { text },
        voice: { languageCode: data.settings.lang, name: googleVoiceName() },
        audioConfig: { audioEncoding: 'MP3', speakingRate: data.settings.ttsRate }
      }), signal: controller.signal
    });
    const json = await resp.json();
    if (!resp.ok) throw new Error(json?.error?.message || `HTTP ${resp.status}`);
    if (!json.audioContent) throw new Error('Google 응답에 음성 데이터가 없습니다.');
    if (seq !== ttsSeq) return;
    const raw = atob(json.audioContent);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    ttsUrl = URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }));
    ttsAudio = new Audio(ttsUrl);
    ttsAudio.onended = () => { if (seq === ttsSeq) stopTts(); };
    ttsAudio.onerror = () => { if (seq === ttsSeq) toast('음성 파일을 재생하지 못했어요.'); };
    const playPromise = ttsAudio.play();
    if (playPromise) await playPromise;
  } catch (e) {
    if (e.name === 'AbortError' || seq !== ttsSeq) return;
    const errorText = String(e.message || e);
    toast(errorText.includes('Failed to fetch') || errorText.includes('Load failed')
      ? 'Google API 연결 실패: 네트워크, API 키 제한 또는 브라우저 접근 정책을 확인해 주세요.'
      : 'Google 음성 오류: ' + errorText.slice(0, 180));
    if (ttsAudio && ttsAudio.paused && ttsAudio.src) {
      const panel = document.getElementById('google-audio-fallback');
      if (panel) { panel.innerHTML = ''; panel.append(ttsAudio); ttsAudio.controls = true; panel.hidden = false; }
    }
  } finally {
    if (seq === ttsSeq) ttsRequest = null;
  }
}

    return cls ? `<button type="button" class="w word-button ${cls}" data-act="focus" data-k="${k}" title="이 단어만 연습">${esc(w)}</button>${sep}`
      : `<span class="w">${esc(w)}</span>${sep}`;
  }).join('');
}
function heardHTML(r) {

  mic: () => { if(listening)stopListening(); else {focusWord=null;focusResult=null;startListening();} },
  focus: el => {if(listening)return;focusWord=tokens(data.items[data.pos])[+el.dataset.k].replace(/[^\p{L}\p{N}'’\-]/gu,'').replace(/-$/,'');focusResult=null;render();},
  'focus-speak': () => {if(focusWord)speak(focusWord);},
  'focus-mic': () => {if(listening)stopListening();else if(focusWord)startListening();},
  'focus-close': () => {if(listening)stopListening();focusWord=null;focusResult=null;render();},
  prev: () => { focusWord=null; focusResult=null; if (listening) stopListening(); data.pos = Math.max(0, data.pos - 1); scheduleSave(); render(); },
  next: () => { focusWord=null; focusResult=null; if (listening) stopListening(); data.pos = Math.min(data.items.length - 1, data.pos + 1); scheduleSave(); render(); },
  jump: el => { focusWord=null; focusResult=null; if (listening) stopListening(); data.pos = +el.dataset.i; scheduleSave(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  speak: () => speak(spokenText(data.items[data.pos])),
  'play-mine': () => playMine(),
  drill: () => {
    const words = Object.values(data.stats).filter(s => s.miss > 0)
      .sort((a, b) => b.miss / b.tries - a.miss / a.tries || b.miss - a.miss).slice(0, 10).map(s => s.word);
    startScript(words.join('\n'));
  },
  'clear-stats': () => { data.stats = {}; scheduleSave(); render(); toast('약한 단어 기록을 지웠어요.'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'script') { data.script = e.target.value; scheduleSave(); }
  if (e.target.id === 'google-tts-key') googleTtsKey = e.target.value;
});
document.addEventListener('change', e => {
  const k = e.target.dataset.setting; if (!k) return;
  data.settings[k] = k === 'ttsRate' ? Number(e.target.value) : e.target.value;
  if (k === 'ttsProvider' || k === 'googleVoice' || k === 'lang') stopTts();
  scheduleSave(); if (view === 'practice') render();
});
document.addEventListener('keydown', e => {
  if (view !== 'practice' || e.target.closest('textarea,select,input') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest('button') || e.key==='Tab') return;
  if (e.key === ' ') { e.preventDefault(); actions.mic(); }
  else if (e.key === 'ArrowLeft') actions.prev();
  else if (e.key === 'ArrowRight') actions.next();
  else if (e.key === 'p' || e.key === 'P') actions.speak();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && listening) stopListening(); });
if ('speechSynthesis' in window) speechSynthesis.getVoices();

/* ---------- Init ---------- */
(async () => {
  const d = await Store.load();
  if (d) {
    data = { ...data, ...d, settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) } };
    data.pos = Math.min(Math.max(0, data.pos || 0), Math.max(0, data.items.length - 1));
    if (data.items.length) view = 'practice';
  }
  render();
})();
</script>
